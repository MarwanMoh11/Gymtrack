name: Claude Code

# Mention @claude in a new issue, an issue or PR comment, or a PR review comment,
# and Claude implements it on a branch and opens a pull request.
# The why behind each line is in docs/claude-pipeline.md.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Runs only when @claude appears. The action also rejects anyone without write access,
    # so strangers on this public repo can't trigger it. Keep that check; never add allowed_non_write_users.
    if: |
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    # A Mac, so the run can build and test its own change before pushing it
    # (free on a public repo). The limit is a ceiling for hard bugs that need many
    # build rounds; a normal run takes 10 to 30 minutes.
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # persist-credentials: false would change nothing here: the action removes the
      # checkout's credential and puts its own token in the remote URL. Why that
      # risk is accepted is in docs/claude-pipeline.md (Security).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # The checker is copied out of the repo before Claude starts. Claude may edit
      # any file in the checkout, and a copy it can edit would let it run anything.
      - name: Install the checker
        run: cp scripts/claude-pipeline/check.sh "$RUNNER_TEMP/check.sh"
      - uses: anthropics/claude-code-action@v1
        env:
          # Opus 5.5 at its extra-high effort: more thinking per turn, fewer wrong turns.
          CLAUDE_CODE_EFFORT_LEVEL: xhigh
          # Claude Code stops a command after 2 minutes by default (10 at most);
          # a cold build needs longer.
          BASH_DEFAULT_TIMEOUT_MS: "2400000"
          BASH_MAX_TIMEOUT_MS: "2400000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Lets Claude read CI results, so "@claude fix the build" can see what failed.
          additional_permissions: |
            actions: read
          # Puts a report on the run's summary page (model, turns, duration), so
          # a phone can see what ran and for how long without reading the log.
          display_report: "true"
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github__create_pull_request,Bash(${{ runner.temp }}/check.sh:*)"
            --append-system-prompt "Follow CLAUDE.md. Keep changes small and scoped to the issue. Add or update tests for every behavior change. You can run one command, the checker: '${{ runner.temp }}/check.sh build' compiles all three targets and prints only the errors; '${{ runner.temp }}/check.sh test GymTrackTests/SomeSuite ...' runs the named suites. Run it exactly as written, with no pipes, redirects or cd. Before every push, the build must pass and the suites you added or changed must pass; leave the full suite to CI. Its full logs are in build/claude-check/. When you finish work on an issue, open a pull request from your branch into main yourself, with 'Closes #<issue number>', the suites you ran, and a short 'How to test on device' section in the body."
