name: PR Check

# Every pull request gets, in parallel, two required merge gates, build-and-test
# (all three targets build, and both apps' unit tests pass) and ui-tests (the
# iPhone flows pass), and an advisory Claude review comment.
# The why behind each line is in docs/claude-pipeline.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    # The ruleset on main requires a check with exactly this name.
    name: build-and-test
    if: github.event.pull_request.draft == false
    # Pinned rather than macos-latest, so the Xcode under the build only moves
    # when this line does.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode
        run: xcodebuild -version

      # The same checker a Claude run uses on its own change, so the two can't
      # disagree about how the project is built or which simulators it runs on.
      # It prints only errors and failures; full logs are kept below.
      - name: Build the iPhone app, watch app, widgets and test bundles
        run: scripts/claude-pipeline/check.sh build

      - name: iPhone and watch unit tests
        run: scripts/claude-pipeline/check.sh test GymTrackTests GymTrackWatchTests

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-logs-${{ github.event.pull_request.number }}
          path: |
            build/claude-check/*.log
            build/claude-check/dd*/Logs/Test
          if-no-files-found: ignore
          retention-days: 7

  ui-tests:
    # Required by the ruleset too. It has its own runner because the flows add ten
    # minutes of building and tapping, and in one job the gate passed forty.
    if: github.event.pull_request.draft == false
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: UI tests
        run: scripts/claude-pipeline/check.sh test GymTrackUITests

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-logs-${{ github.event.pull_request.number }}
          path: |
            build/claude-check/*.log
            build/claude-check/dd/Logs/Test
          if-no-files-found: ignore
          retention-days: 7

  review:
    # Fork PRs don't get secrets, so only review PRs from this repo.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit and its base, so the diff can be taken locally.
          fetch-depth: 2
      # The diff is saved to files rather than read through `gh pr diff`, whose
      # output gets cut short on a large PR. A review that lost its turns
      # trying other ways to read it ended without ever posting.
      - name: Save the diff for the review
        run: |
          git diff HEAD^1 HEAD > pr.diff
          git diff --stat=120 HEAD^1 HEAD > pr-stat.txt
      - uses: anthropics/claude-code-action@v1
        env:
          # Opus 5.5 at its extra-high effort: more thinking per turn, fewer wrong turns.
          CLAUDE_CODE_EFFORT_LEVEL: xhigh
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PRs opened by Claude have claude[bot] as the actor, which is rejected by default.
          # This job only comments, so it can't start a loop.
          allowed_bots: "*"
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            Review this pull request for GymTrack, a SwiftUI iPhone + Apple Watch workout
            logger (SwiftData, HealthKit, WatchConnectivity, widgets, a Live Activity).
            It was probably written by another Claude run that built it and ran only the suites
            it touched, so be skeptical and specific. Follow CLAUDE.md, especially its three data rules.

            The PR's full diff is in pr.diff, with a per-file summary in pr-stat.txt, and the
            checkout is the merged code. Read them with Read and Grep; don't run git.

            1. Read the PR's description with `gh pr view`. If the body says "Closes #N",
               read that issue with `gh issue view N` and judge whether the change does what was asked.
            2. Update your previous review comment if one exists, otherwise post a new one:
               `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file <file>`.
               Use exactly this format:

            ## Review: <✅ Merge | ⚠️ Test first | ❌ Reject>
            **Risk:** Low / Medium / High · **Matches the issue:** x/10
            **What changed:** one or two sentences.
            **Tests:** ✓ added/updated and meaningful | ⚠️ thin | ❌ missing for changed behavior
            **Test on device:**
            - [ ] concrete steps on iPhone or Watch (or "Quick launch is enough")
            **Double-check:**
            - specific file:line concerns (likely compile errors, optionals, main-thread UI updates,
              phone/watch sync, state bugs), or "Nothing flagged"

            Rules: give ✅ only for small, low-risk changes with adequate tests that you are confident compile.
            Keep it under 220 words. Never write "@claude" in the comment.
            Budget: post the comment within your first 25 turns, then refine it with --edit-last
            if turns remain. On a large PR, read the riskiest files first and say which you skipped.
          # 40 turns, with the comment due by 25: a small PR's review took 17, and a
          # review that runs out before posting leaves nothing on the PR.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Write"
            --max-turns 40
